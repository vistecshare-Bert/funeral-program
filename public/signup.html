<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Sign Up — Vistec GraphX</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1a2744; --gold: #c8a96e; --cream: #faf7f2; --white: #fff;
    --border: #ddd5c8; --text: #2c2c2c; --muted: #6b6b6b; --error: #b91c1c;
    --radius: 6px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--navy); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--white); border-radius: 10px; padding: 40px 36px;
    width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--navy); text-align: center; }
  .subtitle { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 28px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .field input {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  .field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,169,110,0.15); }
  .field .hint { font-size: 11px; color: var(--muted); }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 999px;
    background: var(--gold); color: var(--navy); font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 6px; transition: transform 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.6; cursor: default; transform: none; }
  .error {
    background: #fde8e8; color: var(--error); font-size: 13px;
    padding: 10px 12px; border-radius: var(--radius); margin-bottom: 16px; display: none;
  }
  .switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
  .switch a { color: var(--navy); font-weight: 600; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Vistec GraphX</div>
    <div class="subtitle">Create Admin Account</div>
    <div class="error" id="errorBox"></div>
    <form id="signupForm">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required minlength="3" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Signup Code</label>
        <input type="text" name="signupCode" required autocomplete="off" />
        <div class="hint">Ask an existing admin for this code.</div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Create Account</button>
    </form>
    <div class="switch">Already have an account? <a href="/login">Log in</a></div>
  </div>
<script>
  const form = document.getElementById('signupForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const password = form.password.value;
    const confirmPassword = form.confirmPassword.value;
    if (password !== confirmPassword) {
      errorBox.textContent = 'Passwords do not match.';
      errorBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';
    try {
      const fd = new FormData(form);
      const resp = await fetch('/signup', { method: 'POST', body: new URLSearchParams(fd) });
      const data = await resp.json();
      if (!resp.ok || !data.success) throw new Error(data.error || 'Sign up failed.');
      location.href = '/admin';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
